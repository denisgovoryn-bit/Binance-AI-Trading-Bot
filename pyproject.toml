[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crypto-signal-bot"
version = "0.1.0"
description = "Exchange-independent crypto signal research and paper-trading platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "aiohttp>=3.10,<4",
  "aiosqlite>=0.20,<1",
  "aiogram>=3.15,<4",
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-json-logger>=2.0,<4",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29,<1"]
redis = ["redis>=5,<7"]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]
