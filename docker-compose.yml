services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://signal_bot:signal_bot@postgres:5432/signal_bot
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  telegram:
    build: .
    command: ["python", "scripts/run_telegram.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://signal_bot:signal_bot@postgres:5432/signal_bot
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["telegram"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signal_bot
      POSTGRES_USER: signal_bot
      POSTGRES_PASSWORD: signal_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped

volumes:
  postgres_data:
